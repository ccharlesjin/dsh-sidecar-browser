<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Select Test</title></head>
<body>
<h1>Select Test</h1>
<label>Plan
  <select id="plan" name="plan">
    <option value="basic">Basic</option>
    <option value="pro">Pro</option>
    <option value="enterprise">Enterprise</option>
  </select>
</label>
<p id="out">out</p>
<script>
  document.getElementById('plan').addEventListener('change', (event) => {
    document.getElementById('out').textContent = `selected:${event.target.value}`;
  });
</script>
</body></html>
